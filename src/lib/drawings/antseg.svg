<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="450" height="250" viewBox="0 0 450 250">
	<!-- OpenVision original art (Apache-2.0). Anterior segment, slit-lamp front view: lids, limbus, iris, pupil. OD on the viewer's left. -->
	<rect width="450" height="250" fill="#fff"/>
	<defs>
		<clipPath id="as-open"><path d="M16 132 Q112 24 208 132 Q112 236 16 132 Z"/></clipPath>
		<g id="as-eye" fill="none" stroke="#6b7280" stroke-width="1.3" stroke-linecap="round">
			<g clip-path="url(#as-open)">
				<!-- iris striations between collarette and limbus -->
				<g stroke="#c4c8cf" stroke-width="1">
					<path d="M112 98 V78 M112 162 V182 M80 130 H58 M144 130 H166"/>
					<path d="M128 102.3 L138 85 M96 102.3 L86 85 M128 157.7 L138 175 M96 157.7 L86 175"/>
					<path d="M84.3 114 L67 104 M139.7 114 L157 104 M84.3 146 L67 156 M139.7 146 L157 156"/>
				</g>
				<circle cx="112" cy="130" r="32" stroke="#9ca3af" stroke-dasharray="3 3"/>
				<circle cx="112" cy="130" r="54" stroke-width="1.6"/>
				<circle cx="112" cy="130" r="17" fill="#d1d5db"/>
			</g>
			<!-- lid margins -->
			<path d="M16 132 Q112 24 208 132" stroke-width="2"/>
			<path d="M16 132 Q112 236 208 132"/>
			<!-- caruncle (nasal, right side for OD) -->
			<path d="M200 124 q-8 8 0 16" stroke="#9ca3af"/>
			<!-- clock guides: 12, 3, 6, 9 -->
			<g stroke="#9ca3af" stroke-width="1">
				<path d="M112 70 v-6 M112 190 v6 M52 130 h-6 M172 130 h6"/>
			</g>
		</g>
	</defs>
	<use xlink:href="#as-eye" href="#as-eye"/>
	<use xlink:href="#as-eye" href="#as-eye" transform="translate(450 0) scale(-1 1)"/>
	<g font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#374151"><text x="12" y="22">OD</text><text x="438" y="22" text-anchor="end">OS</text></g>
	<g font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">
		<text x="112" y="244">temporal | nasal</text>
		<text x="338" y="244">nasal | temporal</text>
	</g>
</svg>
