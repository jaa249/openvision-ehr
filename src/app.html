<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Apply the saved color mode before first paint (no light flash in a dark exam room).
			try {
				var t = localStorage.getItem('ov-theme');
				if (t === 'light' || t === 'dark' || t === 'dim') document.documentElement.setAttribute('data-theme', t);
			} catch (e) {}
			// A viewport short in lines of text (zoom, large text): the exam stops pinning its chrome (D53).
			// Same rule as isShortViewport in src/lib/prefs/textsize.ts.
			try {
				var r = parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;
				if (innerHeight / r < 32) document.documentElement.setAttribute('data-short', '');
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
